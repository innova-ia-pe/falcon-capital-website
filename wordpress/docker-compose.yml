# WordPress local para desarrollar el tema y el plugin de Falcon Capital.
# Uso: docker compose up -d   →   http://localhost:8088  (admin: ver README.md)
# El tema y el plugin se copian al contenedor con ./sincronizar.sh (sin carpetas compartidas).
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: falcon
      MARIADB_USER: falcon
      MARIADB_PASSWORD: falcon-local
      MARIADB_ROOT_PASSWORD: falcon-local-root
    volumes:
      - db:/var/lib/mysql
  wp:
    image: wordpress:php8.4-apache
    depends_on: [db]
    ports:
      - "127.0.0.1:8088:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: falcon
      WORDPRESS_DB_USER: falcon
      WORDPRESS_DB_PASSWORD: falcon-local
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG', false);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp:/var/www/html
  cli:
    image: wordpress:cli-php8.4
    depends_on: [db, wp]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: falcon
      WORDPRESS_DB_USER: falcon
      WORDPRESS_DB_PASSWORD: falcon-local
    volumes:
      - wp:/var/www/html
    entrypoint: ["wp"]
    profiles: ["cli"]
volumes:
  db:
  wp:
